# THE WORKSPACE ROOT, AND IT DECLARES NO DISTRIBUTION OF ITS OWN.
#
# skid is three packages split by which side of the socket a module sits on:
#
#     packages/skid-contract   the route declaration both sides derive from
#     packages/skid-mcp        the client side. httpx and mcp
#     packages/skid            the service side. kokoro, torch, spacy, flask
#
# Two of them install as tools, so `uv tool install` builds two environments
# that are replaced independently and a service restart stops disturbing the
# MCP shim. `docs/DECISIONS/the-socket-is-the-package-boundary.md` is the
# reasoning and the measurements.
#
# There is no [project] table here. A bare `uv run` at a virtual workspace root
# installs every member, verified 2026-09-07 from a cold start with no lock file
# and no virtualenv, so `just test` and the gate's `uv run coverage run` reach
# all three packages with no flag added.
[tool.uv.workspace]
members = ["packages/*"]

# Declared 2026-08-28, having never been. pytest was in the virtualenv because
# somebody installed it rather than because this file asked for it, so `uv sync`
# removed it and a fresh clone could never have run the suite at all.
#
# THE WHOLE QUALITY TOOLCHAIN, not just pytest. The list is the `requires:`
# block of `bolt.python-std-quality.yaml` verbatim, so the gate and a local run
# reach for the same set.
#
# This is not a second statement of what toolbox pins. The jig pins what the
# GATE runs; this declares what the PROJECT needs to check itself, and the
# difference is load-bearing: the jig invokes these from PATH, where python is
# 3.14.7 and cannot import skid's dependencies. Run from here they see the 3.12
# interpreter the code actually uses. `types` reports 30 phantom errors from
# PATH and one real one from the venv, which is the whole argument.
#
# IT SITS AT THE ROOT AND NOT IN A PACKAGE, because there is one suite over all
# three packages and one set of checkers judging them together.
#
# Filed against the jig.
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pylint",
    "complexipy",
    "vulture",
    "interrogate",
    "bandit",
    "coverage",
    "pytest>=8.0",
    # waitress ships no py.typed marker, so mypy cannot see through the import
    # in main.py without these. A stub package rather than an ignore comment:
    # the checker gets the types instead of being told not to look.
    "types-waitress",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

# THREE IMPORT PACKAGES NAMED, NOT ONE, AND COUNTING THEM IS THE CHECK.
#
# The split could have kept every module importable as `skid.x` by making the
# three distributions share one PEP 420 namespace package, which works in every
# way that gets checked first. It was rejected because coverage.py does not
# enumerate unexecuted files in a namespace package: a module no test imports
# leaves the report entirely rather than appearing at 0%, with no warning.
#
# That is hard rule 5's failure with nothing written down. Measured on one tree
# with one file as the only variable; `docs/LESSONS/` carries it.
#
# So each package is a regular package with an `__init__.py`, and all three are
# named here. A package that goes missing from this list stops being measured
# and nothing else says so.
[tool.coverage.run]
branch = true
source = ["skid", "skid_mcp", "skid_contract"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's, which runs a
# bare `mypy .`.
[tool.mypy]
strict = true
warn_unreachable = true
exclude = ['^bin/', '^adapters/']

# skid's dependencies live in .venv because kokoro's metadata declares <3.13 and
# this machine's python3 is 3.14.7. mypy run from PATH therefore cannot import
# flask, waitress, wrench or kokoro, and reports every one of them as a missing
# import rather than checking the code. Naming the interpreter is mypy's own
# answer to that, and it is what makes the gate's `types` task check skid rather
# than report on which python invoked it.
python_executable = ".venv/bin/python"

# kokoro ships no `py.typed` and publishes no stub package, so mypy reports
# `import-untyped` for it and stops describing skid.
#
# AN OVERRIDE RATHER THAN A STUB PACKAGE, which is the opposite of the choice
# made for waitress a few lines above, and the difference is that there is no
# stub package to install. `types-waitress` exists; nothing equivalent exists
# for kokoro, and writing one here would be this repository maintaining a
# description of somebody else's API.
#
# AN OVERRIDE RATHER THAN A `# type: ignore`, because the ignore would sit in
# `generation.py` at the one import and say nothing about why, and it would be a
# pragma the suppression register then has to carry. This says the same thing
# once, where the other tool configuration is, and holds every other import in
# that file to `strict`.
[[tool.mypy.overrides]]
module = ["kokoro.*"]
ignore_missing_imports = true

# WHY bin/ IS EXCLUDED EVERYWHERE BELOW, and why it is scoping rather than
# silencing. bin/ holds nothing skid wrote. It is two symlinks into
# toolbox/bin/, adopted because the common jig resolves its checkers against
# {config_dir}, which is this directory. Measured 2026-08-27: with them linked
# and no exclusion, `mypy .` and `pylint --recursive=y .` fail skid's gate on
# toolbox's source, every finding in test-traceability.py or
# suppression-register.py.
#
# A gate that fails a project for the code it adopted to run the gate is
# reporting on the wrong repository. Excluding a path holding none of this
# project's code says so; it hides no finding about skid and adds no pragma.
# Filed against toolbox: an adopter is graded on the checkers it adopts.

[tool.ruff]
extend-exclude = ["bin"]

[tool.ruff.lint.isort]
# Stated rather than inferred, because the inference is not stable across
# invocations. Measured 2026-08-28 with ruff 0.16.3: `ruff check .` treated
# `skid` as third-party and passed, while the same command with any
# `--extend-exclude` treated it as first-party and reported three I001s. The
# flag's value did not matter; naming `bin`, which is what pyproject already
# says, was enough to flip it.
#
# So the gate and a bare local run disagreed about the same tree, and the gate
# was the one that was right. Declaring it makes the answer the same either way.
#
# ALL THREE PACKAGES, because first-party is a property of this repository and
# not of a distribution. Naming only `skid` would sort the other two as
# third-party and the two runs would disagree again.
known-first-party = ["skid", "skid_mcp", "skid_contract"]

[tool.pylint.MASTER]
# .venv is here for a different reason from bin/. The jig runs
# `pylint --recursive=y .`, which walks the virtualenv, and astroid recurses to
# death inside torch's generated modules: measured 2026-08-27, pylint over src
# and tests takes 1.8s, and over `.` it had not finished after 900s and was
# emitting a RecursionError traceback. So this is not tidiness, it is the
# difference between a gate that runs and one that never returns.
ignore-paths = ['^bin/.*', '^\.venv/.*', '^\.bolt-.*', '^adapters/.*', '^\.ephemera/.*']

# The same split mypy's `python_executable` answers. pylint run from PATH is a
# 3.14.7 interpreter and skid's dependencies are in a 3.12 virtualenv, so
# without this every import of flask, waitress, wrench or kokoro is an
# `import-error` and the findings are about which python ran rather than about
# skid. Globbed rather than pinned to 3.12, so it survives the pin moving.
init-hook = 'import glob, sys; sys.path[:0] = glob.glob(".venv/lib/python*/site-packages")'

[tool.bandit]
exclude_dirs = ["bin", ".ephemera"]
