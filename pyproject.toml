[project]
name = "skid"
version = "0.1.0"
description = "Voice output for the agents. Text in, one clip at a time out."
# The machine-readable half of the licence, which a package index reads and
# LICENSE alone does not give it. An SPDX expression, matching wrench, and it
# must stay in step with the LICENSE file beside it: `tests/test_declarations.py`
# asserts the two agree rather than trusting them to.
#
# license-files puts LICENSE and NOTICE in the built distribution, so a wheel
# carries the terms rather than pointing at a repository somebody may not have.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# FR-1.6 is scope rather than a permanent boundary, and until this line it was a
# sentence in a document with nothing a test could read. Declared so the scope
# is checkable: `tests/test_declarations.py` asserts this exact string.
#
# What makes another platform cheap later is FR-1.3 through FR-1.5, so widening
# this is a matter of naming a player and its command line rather than of
# reworking the output path.
classifiers = [
    "Operating System :: POSIX :: Linux",
]
# 3.12 alone, and not a floor. kokoro declares requires_python <3.13,>=3.10, so
# a bare >=3.12 resolves to an interpreter it refuses. FR-1.7 carries the
# measurement and says to retire the row rather than edit this in place.
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    # kokoro's English path needs this spaCy model and will try to DOWNLOAD it
    # at runtime if it is absent, using pip or uv. Under systemd neither is on
    # PATH, so the service failed to start 76 times before this line existed.
    # Declared rather than fetched: a service must not need a package installer.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "mcp>=2.0",
    "kokoro>=0.9.4",
    # The config and the spool are read, written and validated through wrench,
    # which is the ecosystem's one answer for structured files. It replaced
    # tomlkit, which was here to preserve comments in a file a person edits;
    # `docs/config.sample.yaml` does that job now, so the live file needs no
    # comments and can be emitted canonically.
    "wrench",
    # The backend becomes six plain HTTP routes on the socket systemd hands it,
    # and the MCP server moves into the stdio script, which is what removes the
    # session state a restart invalidates. Chosen 2026-08-28.
    #
    # waitress rather than gunicorn because it takes an inherited fd, which is
    # how socket activation reaches this process. Flask is WSGI and has no
    # server of its own for that.
    #
    # DECLARED BEFORE USE. Nothing imports these until the resilience work
    # lands, and mcp becomes the script's dependency alone at the same time.
    "flask>=3.0",
    "waitress>=3.0",
]

# wrench is not on a package registry, so it is named by git URL. uv takes one
# as readily as a registry name, which is what lets a standalone clone install.
#
# Not editable. wrench used to resolve its schemas by walking up from __file__,
# which forced an editable install, and a PEP 660 import hook is something mypy
# cannot follow, so wrench's py.typed was invisible and every import of it was
# an error. wrench carries its schemas as generated source now.
#
# To develop against a local wrench, override the source rather than editing
# this line:
#
#     uv sync --no-sources        # or point it at ../wrench/python locally
[tool.uv.sources]
wrench = { git = "https://github.com/scriptedworld/wrench.git", subdirectory = "python" }

# Declared 2026-08-28, having never been. pytest was in the virtualenv because
# somebody installed it rather than because this file asked for it, so `uv sync`
# removed it and a fresh clone could never have run the suite at all.
#
# THE WHOLE QUALITY TOOLCHAIN, not just pytest. The list is the `requires:`
# block of `bolt.python-std-quality.yaml` verbatim, so the gate and a local run
# reach for the same set.
#
# This is not a second statement of what toolbox pins. The jig pins what the
# GATE runs; this declares what the PROJECT needs to check itself, and the
# difference is load-bearing: the jig invokes these from PATH, where python is
# 3.14.7 and cannot import skid's dependencies. Run from here they see the 3.12
# interpreter the code actually uses. `types` reports 30 phantom errors from
# PATH and one real one from the venv, which is the whole argument.
#
# Filed against the jig.
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pylint",
    "complexipy",
    "vulture",
    "interrogate",
    "bandit",
    "coverage",
    "pytest>=8.0",
    # waitress ships no py.typed marker, so mypy cannot see through the import
    # in main.py without these. A stub package rather than an ignore comment:
    # the checker gets the types instead of being told not to look.
    "types-waitress",
]

[project.scripts]
skid = "skid.main:main"
skid-mcp = "skid.client:main"
# The socket is the interface and MCP is one client of it. skid-say is another,
# and it needs nothing a session spawned at start-up, which is what made the
# machine silent for hours with a working service behind it.
skid-say = "skid.say:main"
# Reachable by name only once the install it performs has happened, which is why
# `python3 src/skid/install.py` is the documented first run. Both are this file.
skid-install = "skid.install:main"

[tool.hatch.metadata]
# The spaCy model is a direct URL because it is not on PyPI. Declaring it is
# what stops the service reaching for a package installer at start-up.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["skid"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's, which runs a
# bare `mypy .`.
[tool.mypy]
strict = true
warn_unreachable = true
exclude = ['^bin/', '^adapters/']

# skid's dependencies live in .venv because kokoro's metadata declares <3.13 and
# this machine's python3 is 3.14.7. mypy run from PATH therefore cannot import
# flask, waitress, wrench or kokoro, and reports every one of them as a missing
# import rather than checking the code. Naming the interpreter is mypy's own
# answer to that, and it is what makes the gate's `types` task check skid rather
# than report on which python invoked it.
python_executable = ".venv/bin/python"

# WHY bin/ IS EXCLUDED EVERYWHERE BELOW, and why it is scoping rather than
# silencing. bin/ holds nothing skid wrote. It is two symlinks into
# toolbox/bin/, adopted because the common jig resolves its checkers against
# {config_dir}, which is this directory. Measured 2026-08-27: with them linked
# and no exclusion, `mypy .` and `pylint --recursive=y .` fail skid's gate on
# toolbox's source, every finding in test-traceability.py or
# suppression-register.py.
#
# A gate that fails a project for the code it adopted to run the gate is
# reporting on the wrong repository. Excluding a path holding none of this
# project's code says so; it hides no finding about skid and adds no pragma.
# Filed against toolbox: an adopter is graded on the checkers it adopts.

[tool.ruff]
extend-exclude = ["bin"]

[tool.ruff.lint.isort]
# Stated rather than inferred, because the inference is not stable across
# invocations. Measured 2026-08-28 with ruff 0.16.3: `ruff check .` treated
# `skid` as third-party and passed, while the same command with any
# `--extend-exclude` treated it as first-party and reported three I001s. The
# flag's value did not matter; naming `bin`, which is what pyproject already
# says, was enough to flip it.
#
# So the gate and a bare local run disagreed about the same tree, and the gate
# was the one that was right. Declaring it makes the answer the same either way.
known-first-party = ["skid"]

[tool.pylint.MASTER]
# .venv is here for a different reason from bin/. The jig runs
# `pylint --recursive=y .`, which walks the virtualenv, and astroid recurses to
# death inside torch's generated modules: measured 2026-08-27, pylint over src
# and tests takes 1.8s, and over `.` it had not finished after 900s and was
# emitting a RecursionError traceback. So this is not tidiness, it is the
# difference between a gate that runs and one that never returns.
ignore-paths = ['^bin/.*', '^\.venv/.*', '^\.bolt-.*', '^adapters/.*', '^\.ephemera/.*']

# The same split mypy's `python_executable` answers. pylint run from PATH is a
# 3.14.7 interpreter and skid's dependencies are in a 3.12 virtualenv, so
# without this every import of flask, waitress, wrench or kokoro is an
# `import-error` and the findings are about which python ran rather than about
# skid. Globbed rather than pinned to 3.12, so it survives the pin moving.
init-hook = 'import glob, sys; sys.path[:0] = glob.glob(".venv/lib/python*/site-packages")'

[tool.bandit]
exclude_dirs = ["bin", ".ephemera"]
