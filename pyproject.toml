[project]
name = "skid"
version = "0.1.0"
description = "Voice output for the agents. Text in, one clip at a time out."
# 3.12 alone, and not a floor. kokoro declares requires_python <3.13,>=3.10, so
# a bare >=3.12 resolves to an interpreter it refuses. FR-1.7 carries the
# measurement and says to retire the row rather than edit this in place.
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["skid"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's, which runs a
# bare `mypy .`.
[tool.mypy]
strict = true
warn_unreachable = true
