[project]
name = "skid"
version = "0.1.0"
description = "Voice output for the agents. Text in, one clip at a time out."
# 3.12 alone, and not a floor. kokoro declares requires_python <3.13,>=3.10, so
# a bare >=3.12 resolves to an interpreter it refuses. FR-1.7 carries the
# measurement and says to retire the row rather than edit this in place.
requires-python = ">=3.12,<3.13"
# tomlkit rather than tomllib: FR-7.1 and FR-7.8 make the config the record, and
# writing into a file a person owns means preserving their comments and their
# entry order. tomllib reads and cannot write; a parse-and-re-emit would discard
# both. FR-8.4 makes the entry order load-bearing rather than cosmetic.
dependencies = [
    "httpx",
    # kokoro's English path needs this spaCy model and will try to DOWNLOAD it
    # at runtime if it is absent, using pip or uv. Under systemd neither is on
    # PATH, so the service failed to start 76 times before this line existed.
    # Declared rather than fetched: a service must not need a package installer.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "mcp>=2.0",
    "kokoro>=0.9.4",
    "tomlkit>=0.13",
]

[project.scripts]
skid = "skid.main:main"
skid-mcp = "skid.client:main"
# Reachable by name only once the install it performs has happened, which is why
# `python3 src/skid/install.py` is the documented first run. Both are this file.
skid-install = "skid.install:main"

[tool.hatch.metadata]
# The spaCy model is a direct URL because it is not on PyPI. Declaring it is
# what stops the service reaching for a package installer at start-up.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["skid"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's, which runs a
# bare `mypy .`.
[tool.mypy]
strict = true
warn_unreachable = true
exclude = ['^bin/']

# WHY bin/ IS EXCLUDED EVERYWHERE BELOW, and why it is scoping rather than
# silencing. bin/ holds nothing skid wrote. It is two symlinks into
# toolbox/bin/, adopted because the common jig resolves its checkers against
# {config_dir}, which is this directory. Measured 2026-08-27: with them linked
# and no exclusion, `mypy .` and `pylint --recursive=y .` fail skid's gate on
# toolbox's source, every finding in test-traceability.py or
# suppression-register.py.
#
# A gate that fails a project for the code it adopted to run the gate is
# reporting on the wrong repository. Excluding a path holding none of this
# project's code says so; it hides no finding about skid and adds no pragma.
# Filed for toolbox as clank/inbox/toolbox/an-adopter-is-graded-on-the-checkers-it-adopts.

[tool.ruff]
extend-exclude = ["bin"]

[tool.pylint.MASTER]
# .venv is here for a different reason from bin/. The jig runs
# `pylint --recursive=y .`, which walks the virtualenv, and astroid recurses to
# death inside torch's generated modules: measured 2026-08-27, pylint over src
# and tests takes 1.8s, and over `.` it had not finished after 900s and was
# emitting a RecursionError traceback. So this is not tidiness, it is the
# difference between a gate that runs and one that never returns.
ignore-paths = ['^bin/.*', '^\.venv/.*', '^\.bolt-.*']

[tool.bandit]
exclude_dirs = ["bin", ".ephemera"]
