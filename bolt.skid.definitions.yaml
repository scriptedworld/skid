# Placeholder values for the jigs skid adopts, overriding their own defaults.
#
#     bolt common-quality . --definitions skid
#
# The common jig defaults `requirements` to REQUIREMENTS.md, which is the
# retired single-file layout. skid holds requirements as a directory, ruled in
# silo/docs/DECISIONS/requirements-are-a-directory.md, so the check is pointed
# at where they actually live.
#
# THIS IS NOT SILENCING THE CHECK. The decision names the wrong move by name:
# concatenating the tree into a file to feed the checker. Naming the real
# location is the opposite of that, and whether the checker can read a directory
# is its own question, filed as
# clank/inbox/toolbox/traceability-must-read-a-directory.

requirements: docs/REQUIREMENTS
