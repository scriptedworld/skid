# Placeholder values for the jigs skid adopts, overriding their own defaults.
#
#     bolt --definitions skid common-quality .
#
# The flag goes BEFORE the positionals. After them it becomes a positional and
# bolt refuses with usage, writing no run directory at all.
#
# `requirements` defaults to REQUIREMENTS.md, the retired single-file layout.
# skid holds requirements as a directory, so the check is pointed at where they
# actually live. THIS IS NOT SILENCING THE CHECK: the wrong move would be
# concatenating the tree into a file to feed the checker a default it expects.
#
# `suppressions` defaults to SUPPRESSIONS at the run root. skid's register is
# docs/SUPPRESSIONS.md. Without this line the checker looks for a register that
# is not there and fails skid for holding five registered pragmas.

requirements: docs/REQUIREMENTS
suppressions: docs/SUPPRESSIONS.md
