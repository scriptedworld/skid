# skid, every setting with its default.
#
# Copy to ~/.config/skid/config.yaml and change what you want. The file need
# only hold what differs; a missing file is not an error and every key below
# falls back to the value shown.
#
# skid writes to this file when a setting is changed through an MCP tool, so it
# is a file both you and skid edit.
#
# THIS FILE IS WHERE THE REASONS LIVE. skid rewrites the live config
# canonically, with every key quoted and sorted, so comments you put there do
# not survive a tool call. Keep your notes here and copy values across.
#
# A key skid does not recognise is REFUSED rather than ignored, so a typo tells
# you at start-up instead of silently leaving the default in place.

# Any kokoro voice. What everybody speaks in when `voices` below is empty, and
# what `set_voice` sets.
voice: af_heart

# The shortlist skid assigns from, one voice per name that speaks.
#
# EMPTY MEANS OFF. With no entries here nobody is assigned anything and `voice`
# above speaks for everybody, which is how skid behaved before this existed.
#
# alias is what a person calls the voice. It is never spoken: skid announces the
# name of the calling agent, not this. It only has to be distinguishable on the
# page, and no two entries may share one.
#
# pipeline is the kokoro phonemiser, and leaving it out means the one the voice
# id's first letter implies, which is what you want for af_ and bm_ and the
# rest. Naming it is for a voice you want speaking a language that is not its
# own: if_sara through the Italian phonemiser reads English as an Italian would
# read it aloud from a page, where if_sara through `a` speaks correct English in
# an Italian accent. The second is usually the point.
#
# A voice assigned to a name is kept while that name keeps talking, and released
# once it has been quiet for assignment_window_seconds. When every voice is
# held, the one whose last clip is oldest is given out a second time.
voices:
  - alias: Denise
    voice: af_heart

  - alias: Marcus
    voice: bm_daniel

  - alias: Wendy
    voice: if_sara
    pipeline: a

# Seconds of quiet after which a name loses its assigned voice and it returns to
# the pool. Six hours: long, because losing a voice while a session is still
# working is audible and holding one spare is not.
assignment_window_seconds: 21600

# The command that plays a clip. {file} is substituted with the path.
# It must not return before the audio is inaudible, or the next clip overlaps.
player: paplay {file}

# Seconds of quiet after which a name announces itself again, measured from the
# end of the last clip spoken for that name.
greeting_window_seconds: 30

# Seconds after which a queued submission is discarded rather than spoken, with
# a line in the log. Time the service spends stopped counts toward this.
expiry_seconds: 300

# Pronunciation substitutions, applied on the way to the engine only: they
# change nothing you submitted and nothing the log records.
#
# ORDER IN THIS FILE IS THE ORDER THEY ARE TRIED. Substitution is one
# left-to-right pass over the text, and at each position the first entry that
# matches there wins; the scan then resumes after what the replacement produced,
# so no entry sees another's output. Reordering them means editing this file.
#
# kind is "literal" or "regex", and defaults to literal. A literal is matched
# whole-word where the adjacent character is a word character, so it does not
# fire inside a longer word. A regex is matched case-insensitively.
substitution:
  - kind: literal
    pattern: kokoro
    replacement: koh koh roh

  - kind: regex
    pattern: \bFR-([0-9]+)\.([0-9]+)\b
    replacement: requirement \1 point \2
